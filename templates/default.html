<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$title$ – Grzegorz Czech</title>
    <!-- "?v=..." makes browsers fetch the style sheet again instead of using
         an old saved copy. Change the number whenever you change the CSS. -->
    <link rel="stylesheet" href="/css/default.css?v=3">

    <!-- KaTeX: displays mathematics written between $$ ... $$ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
            onload="document.querySelectorAll('.math').forEach(function (el) {
                      katex.render(el.textContent, el, {
                        displayMode: el.classList.contains('display'),
                        throwOnError: false });
                    });"></script>
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="/index.html">Grzegorz Czech</a>
        <!-- Pronunciation: links to IPA Reader, which reads the IPA aloud (Polish voice "Ewa"). -->
        <a class="ipa" href="https://ipa-reader.com/?text=%CB%88%C9%A1%CA%90%C9%9B%C9%A1%C9%94%CA%82%20t%CD%A1%CA%82%C9%9Bx&amp;voice=Ewa" title="Hear the pronunciation">[ˈɡʐɛɡɔʂ t͡ʂɛx]</a>
      </div>
      <nav>
        <a href="/blog.html">Blog</a>
        <!-- Leafless tree picture: Twemoji (https://github.com/jdecked/twemoji), CC BY 4.0 -->
        <a href="/operads.html">Operads<img class="nav-emoji" src="/images/leafless-tree.svg" alt="" width="20" height="20"></a>
      </nav>
    </header>

    <main>
      $if(hidetitle)$$else$<h1>$title$</h1>$endif$
      $body$
    </main>

    <footer>
      Site generated by <a href="https://jaspervdj.be/hakyll">Hakyll</a>
    </footer>

    <!-- Visitor statistics (GoatCounter: no cookies, no personal data).
         Dashboard: https://concombre.goatcounter.com -->
    <script data-goatcounter="https://concombre.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
